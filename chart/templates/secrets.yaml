{{- $pg := lookup "v1" "Secret" .Release.Namespace "postgres-admin" }}
{{- $bao := lookup "v1" "Secret" .Release.Namespace "bao-root" }}
apiVersion: v1
kind: Secret
metadata: {name: postgres-admin}
data:
  password: {{ if $pg }}{{ index $pg.data "password" }}{{ else }}{{ randAlphaNum 24 | b64enc }}{{ end }}
---
apiVersion: v1
kind: Secret
metadata: {name: bao-root}
data:
  token: {{ if $bao }}{{ index $bao.data "token" }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
